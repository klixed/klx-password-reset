<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password · KLX Trade Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; }
  body {
    background: #0b1120;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #1e293b;
    padding: 32px;
    border-radius: 16px;
    max-width: 400px;
    width: 100%;
    border: 1px solid #334155;
    box-sizing: border-box;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .logo {
    color: #dc2626;
    font-size: 48px;
    font-weight: 900;
    text-align: center;
    margin: 0;
    letter-spacing: 2px;
  }
  .subtitle {
    color: #94a3b8;
    text-align: center;
    margin: 4px 0 28px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  h2 {
    color: #f1f5f9;
    font-size: 20px;
    margin: 0 0 20px;
    font-weight: 700;
  }
  label {
    color: #94a3b8;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
    display: block;
    margin-bottom: 6px;
    margin-top: 12px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #f1f5f9;
    font-size: 16px;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: #dc2626;
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
  }
  button {
    width: 100%;
    padding: 14px;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 24px;
    letter-spacing: 0.5px;
  }
  button:hover { background: #b91c1c; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.4;
  }
  .error {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }
  .success {
    background: rgba(34, 197, 94, 0.15);
    color: #86efac;
    border: 1px solid rgba(34, 197, 94, 0.3);
  }
  .account {
    background: rgba(220, 38, 38, 0.08);
    border: 1px solid rgba(220, 38, 38, 0.3);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 0 0 20px;
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.5;
  }
  .account .label {
    color: #94a3b8;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
    display: block;
    margin-bottom: 2px;
  }
  .account strong { color: #f1f5f9; font-weight: 700; }
  .mfaInput {
    font-size: 22px;
    letter-spacing: 8px;
    text-align: center;
    font-family: monospace;
  }
  .mfaHint {
    color: #94a3b8;
    font-size: 12px;
    margin: 6px 0 0;
    line-height: 1.4;
  }
  .mfaToggle {
    display: inline-block;
    margin-top: 10px;
    color: #dc2626;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
  }
  .mfaToggle:hover { text-decoration: underline; }
  .backupMode .mfaInput {
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">KLX</div>
  <div class="subtitle">Trade Tracker</div>
  <h2 id="greeting">Reset your password</h2>
  <div id="account" class="account" style="display:none"></div>
  <form id="form">
    <div id="mfaBlock" style="display:none">
      <label id="mfaLabel" for="mfa">Authenticator code</label>
      <input type="text" id="mfa" placeholder="123456" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="mfaInput" />
      <p id="mfaHint" class="mfaHint">This account has two-factor enabled. Enter the current 6-digit code from your authenticator app.</p>
      <a href="#" id="mfaToggle" class="mfaToggle">Don't have access to your authenticator? Use a backup code</a>
    </div>
    <label for="pw">New Password</label>
    <input type="password" id="pw" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" placeholder="Repeat your password" required minlength="6" autocomplete="new-password" />
    <button type="submit" id="submit">Reset Password</button>
  </form>
  <div id="status" style="display:none"></div>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://lydlytnkvrwsjzipjphm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_lpDXbSNBXT-ghuFA-2YwrQ_NuA3ztzw';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    detectSessionInUrl: true,
    persistSession: true,
    autoRefreshToken: true,
  },
});

const statusEl   = document.getElementById('status');
const form       = document.getElementById('form');
const submit     = document.getElementById('submit');
const greetingEl = document.getElementById('greeting');
const accountEl  = document.getElementById('account');
const mfaBlock   = document.getElementById('mfaBlock');
const mfaLabel   = document.getElementById('mfaLabel');
const mfaInput   = document.getElementById('mfa');
const mfaHint    = document.getElementById('mfaHint');
const mfaToggle  = document.getElementById('mfaToggle');

let totpFactor = null; // populated when the account has verified TOTP
let mfaMode    = 'totp'; // 'totp' | 'backup'

function setMfaMode(mode) {
  mfaMode = mode;
  if (mode === 'backup') {
    mfaBlock.classList.add('backupMode');
    mfaLabel.textContent = 'Backup code';
    mfaInput.value = '';
    mfaInput.setAttribute('maxlength', '11');
    mfaInput.setAttribute('inputmode', 'text');
    mfaInput.setAttribute('autocomplete', 'off');
    mfaInput.setAttribute('placeholder', 'XXXXX XXXXX');
    mfaHint.textContent = 'Enter one of the 10-character recovery codes you saved when you set up 2FA. The code will be used up and 2FA will be removed from your account.';
    mfaToggle.textContent = 'I have my authenticator code — go back';
  } else {
    mfaBlock.classList.remove('backupMode');
    mfaLabel.textContent = 'Authenticator code';
    mfaInput.value = '';
    mfaInput.setAttribute('maxlength', '6');
    mfaInput.setAttribute('inputmode', 'numeric');
    mfaInput.setAttribute('autocomplete', 'one-time-code');
    mfaInput.setAttribute('placeholder', '123456');
    mfaHint.textContent = 'This account has two-factor enabled. Enter the current 6-digit code from your authenticator app.';
    mfaToggle.textContent = "Don't have access to your authenticator? Use a backup code";
  }
  mfaInput.focus();
}

mfaToggle.addEventListener('click', (e) => {
  e.preventDefault();
  setMfaMode(mfaMode === 'totp' ? 'backup' : 'totp');
});

function show(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + type;
  statusEl.style.display = 'block';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Personalize the heading + show the account the link belongs to so the user
// can confirm they're resetting the right one. Also pre-check whether the
// account has TOTP MFA enrolled — if so, reveal the authenticator-code field
// which is required before the password can change.
async function personalize() {
  try {
    const { data } = await supabase.auth.getUser();
    const u = data?.user;
    if (!u) return;
    const metaName = u.user_metadata?.username;
    const emailName = u.email ? u.email.split('@')[0] : null;
    const name = metaName || emailName || 'there';
    const synth = (u.email || '').endsWith('@klx-trader.local');
    greetingEl.textContent = `Hi ${name}, let's reset your password.`;
    accountEl.innerHTML = `
      <span class="label">Account</span>
      <strong>${esc(name)}</strong>${synth ? '' : ` &middot; ${esc(u.email)}`}
    `;
    accountEl.style.display = 'block';
  } catch (err) {
    // Non-fatal — the page just stays generic.
    console.warn('personalize failed', err);
  }

  try {
    const { data: factors } = await supabase.auth.mfa.listFactors();
    const all = factors?.all || factors?.totp || [];
    const totp = all.find((f) => f.factor_type === 'totp' && f.status === 'verified');
    if (totp) {
      totpFactor = totp;
      mfaBlock.style.display = '';
    }
  } catch (err) {
    console.warn('MFA listFactors failed', err);
  }
}

let recoveryReady = false;
function markReady() {
  if (recoveryReady) return;
  recoveryReady = true;
  form.style.display = '';
  personalize();
}

// The SDK fires PASSWORD_RECOVERY after it processes the email link's hash.
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
    markReady();
  }
});

// Manual fallback: if the URL carried tokens in the hash, parse and inject.
async function hydrateFromHashOrQuery() {
  // Hash flow: #access_token=…&refresh_token=…&type=recovery
  if (window.location.hash && window.location.hash.length > 1) {
    const h = new URLSearchParams(window.location.hash.slice(1));
    const access_token  = h.get('access_token');
    const refresh_token = h.get('refresh_token');
    if (access_token && refresh_token) {
      const { error } = await supabase.auth.setSession({ access_token, refresh_token });
      if (!error) { markReady(); return; }
    }
  }
  // PKCE flow: ?code=…
  const q = new URLSearchParams(window.location.search);
  if (q.get('code')) {
    const { error } = await supabase.auth.exchangeCodeForSession(q.get('code'));
    if (!error) { markReady(); return; }
  }
  // No tokens anywhere → maybe the SDK already set a session asynchronously
  const { data } = await supabase.auth.getSession();
  if (data?.session) markReady();
}

// Hide the form until we know we have a recovery session.
form.style.display = 'none';
hydrateFromHashOrQuery();

setTimeout(() => {
  if (!recoveryReady) {
    show(
      'This reset link is invalid or has expired. Request a new password-reset email and try again.',
      'error'
    );
  }
}, 120000);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw      = document.getElementById('pw').value;
  const confirm = document.getElementById('confirm').value;
  if (pw !== confirm) { show('Passwords do not match.', 'error'); return; }

  // If TOTP is enrolled we require the user to prove it before changing the
  // password. Loss of password + loss of authenticator + loss of backup codes
  // is a genuine lockout — that's intended behaviour of two-factor.
  if (totpFactor) {
    const raw = (mfaInput.value || '').trim();
    if (mfaMode === 'backup') {
      // 10-char hex code (allow a single space between the two halves).
      const clean = raw.toUpperCase().replace(/\s+/g, '');
      if (!/^[0-9A-F]{10}$/.test(clean)) {
        show('Enter a 10-character backup code (letters A–F and digits).', 'error');
        mfaInput.focus();
        return;
      }
      submit.disabled = true;
      submit.textContent = 'Checking code…';
      try {
        const { data: ok, error: rErr } = await supabase.rpc('use_mfa_backup_code', { p_code: clean });
        if (rErr) throw rErr;
        if (ok !== true) throw new Error('That backup code is invalid or has already been used.');
        // Remove the TOTP factor so AAL drops and the user can finish the reset.
        try { await supabase.auth.mfa.unenroll({ factorId: totpFactor.id }); } catch (e) { console.warn('unenroll failed', e); }
      } catch (err) {
        show(err.message || "That code didn't work.", 'error');
        submit.disabled = false;
        submit.textContent = 'Reset Password';
        return;
      }
    } else {
      if (!/^\d{6}$/.test(raw)) {
        show('Enter the 6-digit code from your authenticator app.', 'error');
        mfaInput.focus();
        return;
      }
      submit.disabled = true;
      submit.textContent = 'Verifying code…';
      try {
        const { data: ch, error: cErr } = await supabase.auth.mfa.challenge({ factorId: totpFactor.id });
        if (cErr) throw cErr;
        const { error: vErr } = await supabase.auth.mfa.verify({
          factorId: totpFactor.id,
          challengeId: ch.id,
          code: raw,
        });
        if (vErr) throw new Error('Invalid authenticator code.');
      } catch (err) {
        show(err.message || "That code didn't work. Try the next one from your app.", 'error');
        submit.disabled = false;
        submit.textContent = 'Reset Password';
        return;
      }
    }
  }

  submit.disabled = true;
  submit.textContent = 'Updating…';
  try {
    const { error } = await supabase.auth.updateUser({ password: pw });
    if (error) throw error;
    const { data } = await supabase.auth.getUser();
    const who = data?.user?.user_metadata?.username || data?.user?.email?.split('@')[0] || 'you';
    const extra = mfaMode === 'backup'
      ? " Your 2FA has been removed — re-enable it from Menu → Account once you're back in."
      : '';
    show(`All set — your new password is active, ${who}. Open the KLX app and sign in.${extra}`, 'success');
    form.style.display = 'none';
  } catch (err) {
    show(err.message || 'Something went wrong. The link may have expired — request another reset email.', 'error');
    submit.disabled = false;
    submit.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
